services:
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users_secret
      POSTGRES_DB: users_db
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-events:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events_secret
      POSTGRES_DB: events_db
    volumes:
      - postgres_events_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-invitations:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invitations
      POSTGRES_PASSWORD: invitations_secret
      POSTGRES_DB: invitations_db
    volumes:
      - postgres_invitations_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invitations -d invitations_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./services/user-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${USERS_DATABASE_URL}
      SERVICE_NAME: ${USER_SERVICE_NAME}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres-users:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  event-service:
    build: ./services/event-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${EVENTS_DATABASE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVICE_NAME: ${EVENT_SERVICE_NAME}
    depends_on:
      postgres-events:
        condition: service_healthy
      user-service:
        condition: service_healthy
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  invitation-service:
    build: ./services/invitation-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${INVITATIONS_DATABASE_URL}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVICE_NAME: ${INVITATION_SERVICE_NAME}
    depends_on:
      postgres-invitations:
        condition: service_healthy
      event-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8000"
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL}
      INVITATION_SERVICE_URL: ${INVITATION_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GATEWAY_TITLE: ${GATEWAY_TITLE}
      GATEWAY_VERSION: ${GATEWAY_VERSION}
      SERVICE_NAME: ${SERVICE_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SERVE_FRONTEND: ${SERVE_FRONTEND}
      FRONTEND_DIR: ${FRONTEND_DIR}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT}
      DOCS_URL: ${DOCS_URL}
      REDOC_URL: ${REDOC_URL}
      OPENAPI_URL: ${OPENAPI_URL}
    depends_on:
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      invitation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_users_data:
  postgres_events_data:
  postgres_invitations_data:
