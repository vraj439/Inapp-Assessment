services:
  user-service:
    build: ./services/user-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${USERS_DATABASE_URL}
      SERVICE_NAME: ${USER_SERVICE_NAME}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  event-service:
    build: ./services/event-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${EVENTS_DATABASE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVICE_NAME: ${EVENT_SERVICE_NAME}
    depends_on:
      user-service:
        condition: service_healthy
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  invitation-service:
    build: ./services/invitation-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${INVITATIONS_DATABASE_URL}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVICE_NAME: ${INVITATION_SERVICE_NAME}
    depends_on:
      event-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8000"
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL}
      INVITATION_SERVICE_URL: ${INVITATION_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GATEWAY_TITLE: ${GATEWAY_TITLE}
      GATEWAY_VERSION: ${GATEWAY_VERSION}
      SERVICE_NAME: ${SERVICE_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SERVE_FRONTEND: ${SERVE_FRONTEND}
      FRONTEND_DIR: ${FRONTEND_DIR}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT}
      DOCS_URL: ${DOCS_URL}
      REDOC_URL: ${REDOC_URL}
      OPENAPI_URL: ${OPENAPI_URL}
    depends_on:
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      invitation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
